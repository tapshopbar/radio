<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="/radio/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3A0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>tsb radio · 매장 플레이어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--wine:#4A0B18;--wine1:#6E1426;--wine2:#3A0812;--navy:#141B33;--cream:#FFFDFC;--yellow:#FFC100;--rose:#C9A3A6;--grey:#8E8A8C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--cream);
    background:radial-gradient(120% 90% at 20% 0%,var(--wine1) 0%,var(--wine) 45%,var(--wine2) 75%,var(--navy) 130%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6vh 6vw 4vh;-webkit-user-select:none;user-select:none}
  header{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand small{display:block;font-weight:400;font-size:12px;color:var(--rose);letter-spacing:.02em;margin-top:2px}
  .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:300;color:var(--rose)}
  main{width:100%;max-width:880px;text-align:center}
  .slot{display:inline-block;font-size:12px;font-weight:700;color:#1a1a1a;background:var(--yellow);padding:4px 10px;border-radius:999px;margin-bottom:22px}
  .title{font-size:clamp(34px,7vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1.08;min-height:1.1em}
  .sub{margin-top:12px;color:var(--rose);font-size:15px;min-height:1.2em}
  .bar{margin:34px auto 0;height:3px;background:rgba(255,253,252,.18);border-radius:3px;max-width:560px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--cream);transition:width .5s linear}
  .controls{margin-top:34px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:var(--cream);background:rgba(255,253,252,.08);border:1px solid rgba(255,253,252,.25);border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer}
  button:active{transform:scale(.97)}
  .vol{display:flex;align-items:center;gap:10px;color:var(--rose);font-size:13px}
  input[type=range]{accent-color:var(--cream);width:150px}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(20,27,51,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
  #start button{background:var(--cream);color:var(--wine);border:0;font-weight:800;font-size:22px;padding:22px 56px}
  #start p{color:var(--cream);font-size:14px;opacity:.85;text-align:center;line-height:1.6}
  footer{font-size:12px;color:var(--rose);opacity:.85;text-align:center;line-height:1.7}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">tsb radio<small>tap shop bar · in-store player</small></div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <div class="slot" id="slot">loading</div>
  <div class="title" id="title">tsb radio</div>
  <div class="sub" id="sub">&nbsp;</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="controls">
    <button id="pp">일시정지</button>
    <button id="next">다음 곡</button>
    <div class="vol">볼륨 <input id="vol" type="range" min="0" max="100" value="80"></div>
  </div>
</main>

<footer>
  wine is second americano<br>
  탭샵바 자체 제작 음악만 재생합니다 · 화면을 켜 둔 채로 두세요
</footer>

<div id="start">
  <button id="go">매장 음악 시작</button>
  <p>시간대에 맞춰 자동으로 곡이 바뀝니다<br>오후 카페 · 17시 와인 · 21시 이후 모임</p>
</div>

<script>
(() => {
  const FADE = 4;                 // crossfade seconds
  const REFRESH_MIN = 30;         // reload tracks.json every N minutes
  let lib = { slots: [], tracks: [] };
  let ctx, master, decks = [], cur = 0, playing = false, history = [], wakeLock = null, advancing = false;

  const $ = id => document.getElementById(id);

  async function loadLib() {
    try {
      const r = await fetch('tracks.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) lib = await r.json();
    } catch (e) { /* keep previous list when offline */ }
  }

  function currentSlot() {
    let h = new Date().getHours();
    if (h < 5) h += 24;
    return lib.slots.find(s => h >= s.from && h < s.to) || lib.slots[0] || { id: 'all', label: 'tsb radio', playlists: [] };
  }

  function pickTrack() {
    const slot = currentSlot();
    let pool = lib.tracks.filter(t => t.playlists.some(p => slot.playlists.includes(p)));
    if (!pool.length) pool = lib.tracks.slice();
    if (!pool.length) return null;
    const recent = history.slice(-Math.min(pool.length - 1, 8));
    const fresh = pool.filter(t => !recent.includes(t.id));
    const list = fresh.length ? fresh : pool;
    return list[Math.floor(Math.random() * list.length)];
  }

  function makeDeck() {
    const a = new Audio();
    a.preload = 'auto';
    a.crossOrigin = 'anonymous';
    const src = ctx.createMediaElementSource(a);
    const g = ctx.createGain();
    g.gain.value = 0;
    src.connect(g).connect(master);
    const d = { a, g, track: null };
    a.addEventListener('timeupdate', () => onTime(d));
    a.addEventListener('ended', () => { if (d === decks[cur]) advance(); });
    a.addEventListener('error', () => { if (d === decks[cur]) setTimeout(advance, 3000); });
    return d;
  }

  function onTime(d) {
    if (d !== decks[cur] || !d.a.duration) return;
    $('prog').style.width = (100 * d.a.currentTime / d.a.duration) + '%';
    if (d.a.duration - d.a.currentTime < FADE && !advancing) advance();
  }

  function showNow(t) {
    const slot = currentSlot();
    $('slot').textContent = slot.label;
    $('title').textContent = t ? t.title : '곡을 준비 중입니다';
    $('sub').textContent = t ? (t.playlists || []).join(' · ') : '';
  }

  async function advance() {
    if (advancing) return;
    advancing = true;
    const t = pickTrack();
    if (!t) { showNow(null); advancing = false; return; }
    const prev = decks[cur];
    cur = 1 - cur;
    const d = decks[cur];
    d.track = t;
    d.a.src = t.file;
    d.a.currentTime = 0;
    const now = ctx.currentTime;
    d.g.gain.cancelScheduledValues(now);
    d.g.gain.setValueAtTime(0, now);
    try { await d.a.play(); } catch (e) { advancing = false; setTimeout(advance, 3000); return; }
    d.g.gain.linearRampToValueAtTime(t.gain || 1, now + FADE);
    if (prev && prev.track) {
      prev.g.gain.cancelScheduledValues(now);
      prev.g.gain.setValueAtTime(prev.g.gain.value, now);
      prev.g.gain.linearRampToValueAtTime(0, now + FADE);
      setTimeout(() => { if (decks[cur] !== prev) prev.a.pause(); }, FADE * 1000 + 200);
    }
    history.push(t.id); if (history.length > 50) history.shift();
    showNow(t);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: 'tsb radio', album: currentSlot().label });
    }
    setTimeout(() => { advancing = false; }, FADE * 1000 + 500);
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  async function start() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = $('vol').value / 100;
    master.connect(ctx.destination);
    decks = [makeDeck(), makeDeck()];
    await ctx.resume();
    $('start').classList.add('hidden');
    playing = true;
    keepAwake();
    advance();
  }

  $('go').onclick = start;
  $('next').onclick = () => { if (ctx) { advancing = false; advance(); } };
  $('pp').onclick = async () => {
    if (!ctx) return;
    if (playing) { await ctx.suspend(); $('pp').textContent = '재생'; }
    else { await ctx.resume(); $('pp').textContent = '일시정지'; }
    playing = !playing;
  };
  $('vol').oninput = e => { if (master) master.gain.value = e.target.value / 100; };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  function tick() {
    const d = new Date();
    $('clock').textContent = d.toTimeString().slice(0, 5);
    if (!ctx) $('slot').textContent = currentSlot().label;
  }
  setInterval(tick, 10000);
  setInterval(loadLib, REFRESH_MIN * 60 * 1000);
  loadLib().then(tick);
})();
</script>
</body>
</html>
